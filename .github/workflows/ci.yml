name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # The ruleset on main requires this job by name ("check").
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.11

      - name: Install (frontend)
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Install (services)
        working-directory: services
        run: bun install --frozen-lockfile

      # convex/_generated is gitignored; tsc needs it. Codegen talks to the
      # DEV deployment only (never prod) to read its schema/function metadata.
      - name: Convex codegen
        working-directory: frontend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY_DEV }}
        run: bunx convex codegen

      - name: Lint, typecheck, test
        working-directory: frontend
        run: bun run check
